{% extends "base_public.html" %}
{% block content %}
<div class="glass-card auth-card">
    <a href="/login" class="back-link">← Back to Login</a>
    <h2>Forgot Password</h2>
    <p style="opacity:0.85;margin-bottom:20px;">Verify the email address linked to your account to reset your password.</p>

    <div id="pe-msg" class="error-msg" style="display:none;"></div>  <!-- shows errors from the server; hidden until needed -->

    <!-- Phone.email email-verification button; the script inside it draws the button and the OTP popup -->
    <div class="pe_verify_email" data-client-id="{{ client_id }}">
        <script src="https://www.phone.email/verify_email_v1.js" async></script>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Phone.email calls this function BY NAME after the email is verified; it must stay global and keep this exact name
function phoneEmailReceiver(userObj) {
    const msg = document.getElementById("pe-msg");
    msg.style.display = "none";                                  // clear any earlier error
    fetch("/forgot/email", {                                     // send the JSON-file URL to YOUR backend; never read it in the browser
        method: "POST",
        headers: { "Content-Type": "application/json" },         // without this Flask's request.get_json() returns nothing
        body: JSON.stringify({ user_json_url: userObj.user_json_url })
    })
    .then(r => r.json())
    .then(data => {
        if (data.ok) { window.location = data.next; }            // success: go to /reset
        else { msg.textContent = data.error; msg.style.display = "block"; }  // show why it failed
    })
    .catch(() => {                                               // network or server error
        msg.textContent = "Something went wrong. Please try again.";
        msg.style.display = "block";
    });
}
</script>
{% endblock %}
